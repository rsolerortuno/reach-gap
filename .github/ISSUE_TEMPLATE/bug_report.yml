name: Bug report
description: Report a reproducible software problem.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected behaviour and observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest command or code example that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: reach-gap version
      placeholder: 0.8.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system and relevant optional dependencies.
