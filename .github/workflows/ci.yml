name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,xenium]"
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Run test suite with coverage gate
        run: pytest -q
      - name: CLI smoke test
        run: reach --help

  quality:
    name: Lint, typing, docs and figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install all quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,xenium,viz]"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: Strict Mypy
        run: mypy src/reach_gap
      - name: Validate publication structure
        run: python scripts/validate_github_publication.py --output /tmp/publication-validation.json
      - name: Regenerate portfolio figures
        run: |
          python scripts/generate_portfolio_figures.py --output-dir /tmp/reach-gap-figures
          test "$(find /tmp/reach-gap-figures -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      - name: Upload regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-portfolio-figures
          path: /tmp/reach-gap-figures/*.png

  scientific-validation:
    name: Scientific result validation
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[xenium]"
      - name: Validate bundled v0.8 result invariants
        run: reach validate-v080-results results/evidence_synthesis_v0.8
      - name: Run quick mechanistic benchmark
        run: reach benchmark --quick --output /tmp/reach-gap-benchmark.json
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: scientific-validation
          path: |
            /tmp/reach-gap-benchmark.json
            results/build_validation_v0.8.json
            results/coverage_v0.8.json
            results/static_analysis_v0.8.json

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs: [tests, quality, scientific-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/reach-gap-wheel-smoke
          /tmp/reach-gap-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/reach-gap-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/reach-gap-wheel-smoke/bin/reach --help
          /tmp/reach-gap-wheel-smoke/bin/python -c "import reach_gap; assert reach_gap.__version__ == '0.8.0'"
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reach-gap-distributions
          path: |
            dist/*
            SHA256SUMS

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t reach-gap:ci .
      - name: Run CLI
        run: docker run --rm reach-gap:ci --help
