name: Publish GitHub release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish, for example v0.8.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-release:
    name: Validate, build and publish
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve and verify release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" == v* ]] || { echo "Tag must start with v"; exit 1; }
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          [[ "$TAG" == "v$PACKAGE_VERSION" ]] || {
            echo "Tag $TAG does not match package version $PACKAGE_VERSION"; exit 1;
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev,xenium,viz]"
      - name: Run full release checks
        run: |
          python -m compileall -q src scripts tests
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src/reach_gap
          pytest -q
          python scripts/validate_github_publication.py --output github_publication_validation_v0.8.json
          python scripts/generate_portfolio_figures.py --output-dir /tmp/reach-gap-release-figures
          reach validate-v080-results results/evidence_synthesis_v0.8
          reach benchmark --quick --output benchmark_quick_v0.8.json
      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/reach-gap-release-smoke
          /tmp/reach-gap-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/reach-gap-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/reach-gap-release-smoke/bin/reach --help
          /tmp/reach-gap-release-smoke/bin/python -c "import reach_gap; assert reach_gap.__version__ == '${{ steps.version.outputs.version }}'"
      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp dist/* release_assets/
          cp results/build_validation_v0.8.json release_assets/
          cp results/coverage_v0.8.json release_assets/
          cp results/static_analysis_v0.8.json release_assets/
          cp results/artifact_manifest_v0.8.json release_assets/scientific_artifact_manifest_v0.8.json
          cp github_publication_validation_v0.8.json release_assets/
          cp benchmark_quick_v0.8.json release_assets/
          cp REACH_GAP_V080_FINAL_RELEASE_REPORT.md release_assets/
          cp RELEASE_NOTES_v0.8.0.md release_assets/
          (
            cd reports
            zip -qr ../release_assets/reach-gap-v0.8.0-portfolio-figures.zip figures
          )
          (
            cd release_assets
            sha256sum * > SHA256SUMS
          )
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: reach-gap ${{ steps.version.outputs.tag }}
          body_path: GITHUB_RELEASE_BODY.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release_assets/*
